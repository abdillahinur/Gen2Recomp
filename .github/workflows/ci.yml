name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Enforce repository content policy
        run: python tools/check_repository_content.py

      - name: Run tests
        run: lua5.1 tests/run_tests.lua

